name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: logikhata_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d logikhata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/logikhata_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_PRIVATE_KEY_BASE64: ${{ secrets.TEST_JWT_PRIVATE_KEY_BASE64 }}
      JWT_PUBLIC_KEY_BASE64: ${{ secrets.TEST_JWT_PUBLIC_KEY_BASE64 }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run prisma:generate
      - run: npm run prisma:migrate:deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
